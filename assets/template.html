<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TITLE</title>
<!-- BlogGen house template — for the agent-authored (Mode B) path.
     Fill the marked slots, delete what you don't use, keep the CSS.
     Drop the MathJax <script> if the post has no maths.
     Reference images by BASENAME only: <img src="fig1.png"> -->
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface-2:#1e2230; --border:#2a2f3d;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#6ea8fe; --accent-2:#7ee0c0;
    --warn:#f0b866; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f7f8fa; --surface:#fff; --surface-2:#eef1f6; --border:#dde2ea;
      --text:#161a22; --muted:#5a6474; --accent:#1f6feb; --accent-2:#0f8f6f;
      --warn:#9a6300;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:2.5rem 1.25rem 5rem; background:var(--bg); color:var(--text);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto}
  header.post{margin-bottom:2.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
  h1{font-size:clamp(1.9rem,4.5vw,2.7rem);line-height:1.2;margin:0 0 .6rem;letter-spacing:-.02em}
  .subtitle{color:var(--muted);font-size:1.1rem;margin:0}
  .meta{color:var(--muted);font-size:.85rem;margin-top:1rem;font-family:var(--mono)}
  h2{font-size:1.5rem;margin:2.75rem 0 .9rem;letter-spacing:-.01em}
  h3{font-size:1.15rem;margin:2rem 0 .6rem;color:var(--accent-2)}
  p{margin:0 0 1.1rem}
  a{color:var(--accent)}
  code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);
       padding:.15em .4em;border-radius:4px}
  pre{background:var(--surface);border:1px solid var(--border);border-radius:10px;
      padding:1rem 1.15rem;overflow-x:auto;font-size:.87rem;line-height:1.5}
  pre code{background:none;padding:0}
  figure{margin:2rem 0}
  figure img{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
  figcaption{color:var(--muted);font-size:.85rem;margin-top:.6rem;text-align:center}
  table{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:.92rem;display:block;overflow-x:auto}
  th,td{padding:.6rem .75rem;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
  tbody tr:hover{background:var(--surface)}
  blockquote{margin:1.5rem 0;padding:.4rem 0 .4rem 1.15rem;border-left:3px solid var(--accent);color:var(--muted)}
  /* callout: use for caveats/limitations that must travel with a result */
  .callout{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn);
           border-radius:8px;padding:1rem 1.15rem;margin:1.75rem 0}
  .callout h4{margin:0 0 .5rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--warn)}
  .callout p:last-child, .callout ul:last-child{margin-bottom:0}
  .pill{display:inline-block;font-family:var(--mono);font-size:.75rem;padding:.2em .6em;
        border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
  footer.post{margin-top:4rem;padding-top:1.5rem;border-top:1px solid var(--border);
              color:var(--muted);font-size:.85rem}
</style>
<!-- Delete if the post contains no mathematics -->
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]}};</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
<div class="wrap">

  <header class="post">
    <h1>TITLE</h1>
    <p class="subtitle">ONE-LINE STANDFIRST</p>
    <p class="meta">DATE · CONTEXT</p>
  </header>

  <article>
    <!-- BODY -->
  </article>

  <footer class="post">
    <p>FOOTER</p>
  </footer>

</div>
</body>
</html>
